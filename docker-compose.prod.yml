# Usage: docker compose -f docker-compose.prod.yml up --build
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2

  app-1:
    build:
      context: .
      target: production
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://garden_user:garden_pass@pgbouncer:5432/garden_db
      - PORT=3000
      - CORS_ORIGIN=*
    expose:
      - "3000"
    depends_on:
      pgbouncer:
        condition: service_started

  app-2:
    build:
      context: .
      target: production
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - DATABASE_URL=postgresql://garden_user:garden_pass@pgbouncer:5432/garden_db
      - PORT=3000
      - CORS_ORIGIN=*
    expose:
      - "3000"
    depends_on:
      pgbouncer:
        condition: service_started

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgresql://garden_user:garden_pass@db:5432/garden_db
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - AUTH_TYPE=plain
    expose:
      - "5432"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: garden_user
      POSTGRES_PASSWORD: garden_pass
      POSTGRES_DB: garden_db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden_user -d garden_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
